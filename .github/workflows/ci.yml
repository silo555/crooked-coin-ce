name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Portable engine, UI, and save tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reproduce original icon
        run: python3 tools/make_icon.py --check
      - name: Test TI transfer validator
        run: python3 tools/verify_8xp.py --self-test
      - name: Compile and run with memory and undefined-behavior checks
        env:
          CC: clang
        run: python3 tools/run_tests.py --sanitize

  calculator:
    name: CEdev v15 native .8xp
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and verify pinned official toolchain
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz --output "$RUNNER_TEMP/CEdev-Linux.tar.gz"
          echo "85f4794a617b134249a9cba8a084414e86e16d2a68377b1d72ace30c636dbdf9  $RUNNER_TEMP/CEdev-Linux.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/CEdev-Linux.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/CEdev/bin" >> "$GITHUB_PATH"
          echo "CEDEV=$RUNNER_TEMP/CEdev" >> "$GITHUB_ENV"
      - name: Build calculator program
        run: make
      - name: Validate transfer envelope and every icon byte
        run: python3 tools/verify_8xp.py bin/CROOKED.8xp --icon-asm obj/icon.s
      - name: Save reviewable calculator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CrookedCoinCE-calculator
          path: bin/CROOKED.8xp
          if-no-files-found: error
